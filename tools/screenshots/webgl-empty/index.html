<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGL empty scene (P0-04d)</title>
<style>html,body{margin:0;background:#fff}canvas{display:block;width:256px;height:256px}</style>
</head>
<body>
<!-- Raw WebGL, no library: clear color rgb(26,102,204) and one red triangle. Proves headless Chromium renders WebGL. -->
<canvas id="c" width="256" height="256"></canvas>
<script>
(function () {
  var result = { ok: false, error: null, renderer: null, vendor: null, version: null };
  window.__webgl = result;
  try {
    var gl = document.getElementById("c").getContext("webgl", { antialias: false });
    if (!gl) throw new Error("getContext('webgl') returned null");
    var dbg = gl.getExtension("WEBGL_debug_renderer_info");
    result.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    result.vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    result.version = gl.getParameter(gl.VERSION);
    function shader(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error("shader: " + gl.getShaderInfoLog(s));
      return s;
    }
    var p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}"));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, "precision mediump float;void main(){gl_FragColor=vec4(1.0,0.0,0.0,1.0);}"));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(p));
    gl.useProgram(p);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.8, -0.8, 0.8, -0.8, 0.0, 0.8]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(p, "a");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.viewport(0, 0, 256, 256);
    gl.clearColor(26 / 255, 102 / 255, 204 / 255, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    var err = gl.getError();
    if (err !== gl.NO_ERROR) throw new Error("gl.getError() = " + err);
    result.ok = true;
  } catch (e) {
    result.error = String(e && e.message || e);
  }
})();
</script>
</body>
</html>
