      > **V1 정직한 판정** — 판정은 시뮬과 몬테카를로만 한다. 확률, 가정, 한계를 숨기지 않는다. 1회 미리보기 실행을 판정이라 부르지 않는다.
      > **V5 깨끗한 출처** — 수치, 부품, 에셋은 출처와 라이선스가 기록된 것만 쓴다. 사용자가 선언한 값과 가져온 에셋은 배지로 구분한다.
      이 이슈가 없으면: 물이 있는 장면(배, 부유체, 수중 이동)을 만들 수 없거나, 근사를 숨긴 채 판정처럼 보여 주게 된다.
      ## 문제
      부력과 항력이 근사라는 사실이 인스펙터와 판정 카드에 나오지 않는다.
      ## 완료 정의 (DoD)
      - [ ] 인스펙터와 가정표에 유체 모델 라벨(근사: 부력, 근사: 수중 항력, 근사: 부가질량, 시각 전용: 파도)이 보이고 승인본 SC-12와 대조를 통과한다
      - [ ] 수역이 있는 프로젝트의 판정 카드 "이 모델이 보지 않는 것"에 파도 하중, 조파 저항, 슬로싱, 공동이 자동으로 들어간다
      - [ ] 테스트: 수역이 있는데 라벨이 빠진 판정 카드는 렌더 테스트가 실패한다
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      굴절·반사의 고급 렌더, 물보라와 항적 입자, XR 전용 표현.
      ## 검증 방법
      `pnpm --filter studio test -- fluid-labels && pnpm design:compare --screen sc-12`
      ## 의존성
      선행: FL-03c, FL-04c, J-04b / 후속: FL-05, FL-05c
