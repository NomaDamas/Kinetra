  - id: PC-01
    kind: issue
    parent: P0
    title: "[PC-01] 계획 변경 기록: 물·유체, 대결 모드, 하드웨어 설계"
    labels: ["type:plan-change", "area:process", "stage:S0-process", "prio:P0", "size:S", "needs-founder"]
    milestone: "S0 Process"
    depends_on: []
    body: |-
      ## 대목표
      G0 — 모든 작업이 대목표·핵심 가치·계획에 묶여 한 번에 100% 끝나는 루프를 만든다. (에픽 P0, docs/plan/studio-plan.md 12절, 15.6절)
      ## 핵심 가치
      > **V3 한 번에 100%** — 작은 단위를 증거와 함께 완전히 끝낸다. 부분 완성은 미완성이다.
      이 이슈가 없으면: 새 요구가 계획·이슈·안전선 없이 구현으로 흘러들어 S1 범위가 조용히 늘고, 무기 경계가 정해지지 않은 채 대결 기능이 만들어진다.
      ## 문제
      창업자가 새 요구를 냈다: "지금하는것과 더불어서 바다 물, 유체등도 모두 가능하게. 군사대결 같은걸로. 하드웨어 설계까지." 현재 계획은 유체를 S3 연구 한 건(T-06)으로, 하드웨어 설계를 S5로 두고 있고, 대결 모드와 무기 경계는 정의하지 않았다.
      ## 완료 정의 (DoD)
      - [ ] `docs/plan/studio-plan.md`에 15절(물·유체 세 층, 대결 모드와 안전선, 하드웨어 설계, 단계 배치, 개발 자원 가드)이 있고 3·4.7·5·8·9·10·11·12·13·14절이 그에 맞게 갱신됐다
      - [ ] `docs/plan/values.md`와 `issues.yaml`의 대목표에 G6이 같은 문장으로 있다. V1~V5 문장은 바뀌지 않았다
      - [ ] `issues.yaml`에 새 항목(PC-01, P0-09, 에픽 FL·CB·HW와 그 하위)이 기존 272개 뒤에 붙었다. 기존 항목은 한 글자도 바뀌지 않았다
      - [ ] 검사 로그: YAML 파싱, ID 중복 없음, `parent`·`depends_on`·라벨·마일스톤 존재, 본문 순서(대목표 → 핵심 가치 → 문제 → DoD → 범위 밖 → 검증 → 의존성)
      - [ ] 창업자 결정 코멘트 네 건: ① 물 저비용 층을 S2 첫 묶음에 두는 안(대안: S1 5주 차에 넣고 S1을 한 주 늘린다) ② 하드웨어 사양 내보내기를 S2에 두는 안 ③ 안전선 문안(15.3절) ④ G6 문장
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      새 항목의 구현. 기존 이슈 본문의 수정(새 항목과 기존 항목의 연결은 새 항목의 `parent`와 `depends_on`이 원본이다).
      ## 검증 방법
      `git diff origin/main -- docs/plan/issues.yaml | grep -c "^-[^-]"`가 0이고, PR의 검사 로그와 창업자 결정 코멘트가 있다
      ## 의존성
      선행: 없음 / 후속: CB-01, CB-01a
  - id: P0-09
    kind: issue
    parent: P0
    title: "[P0-09] 개발 자원 가드: 무거운 실행 전 스왑·SSD 검사"
    labels: ["type:infra", "area:process", "stage:S0-process", "prio:P1", "size:S"]
    milestone: "S0 Process"
    depends_on: [P0-01b]
    body: |-
      ## 대목표
      G0 — 모든 작업이 대목표·핵심 가치·계획에 묶여 한 번에 100% 끝나는 루프를 만든다. (에픽 P0, docs/plan/studio-plan.md 12절, 15.6절)
      ## 핵심 가치
      > **V3 한 번에 100%** — 작은 단위를 증거와 함께 완전히 끝낸다. 부분 완성은 미완성이다.
      이 이슈가 없으면: 무거운 실행이 개발 머신을 멈추거나 디스크를 채워 잎을 한 번에 끝내지 못하고, 실패 원인이 코드인지 머신인지 구분할 수 없다.
      ## 문제
      개발 머신의 SSD 여유가 25 GB 안팎이고 스왑이 자주 가득 찬다(창업자 보고). WebXR 에뮬레이터, 다물체 스케일 측정, 영상 인코딩, 유체 연구 실행이 머신을 멈추거나 디스크를 채울 수 있다.
      ## 완료 정의 (DoD)
      - [ ] `tools/dev/resource_guard.py`가 SSD 여유, 스왑 사용량, 메모리 압력을 출력하고 임계 미달이면 0이 아닌 코드로 끝난다(macOS와 Linux)
      - [ ] 임계값은 설정 파일에 있고 `기본값` 배지가 붙는다([제안] SSD 여유 10 GB 미만이면 차단, 스왑 사용률 90% 이상이면 경고, 메모리 압력이 위험 단계면 차단). 이 머신에서 XR 에뮬레이터 1회 실행 전후의 SSD·스왑 변화를 재서 문서에 적고 임계를 다시 정한다
      - [ ] `docs/process/dev-resources.md`에 규칙이 있다: 무거운 실행은 한 번에 하나, 실행 전 가드 통과, 차단됐을 때의 정리 절차(임시 worktree, uv·pnpm 캐시, Playwright 브라우저, 스파이크 산출물)와 측정 기록 양식
      - [ ] 무거운 실행의 진입점 목록(XR 에뮬레이터 테스트, 강체 1,000개 이상 스케일 측정, 영상 인코딩, 유체 연구 실행)이 문서에 있고, 이미 있는 진입점은 가드를 먼저 부른다
      - [ ] 테스트: 가짜 측정값을 넣어 차단·경고·통과를 단언한다
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      자원 사용 최적화. CI 러너의 자원 관리. 머신 교체나 증설 결정(창업자).
      ## 검증 방법
      `uv run python tools/dev/resource_guard.py --profile heavy; echo $?`, `uv run pytest tools/dev -q`
      ## 의존성
      선행: P0-01b / 후속: FL-06
