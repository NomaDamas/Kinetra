  - id: HW-06a
    kind: sub
    parent: HW-06
    title: "[HW-06a] SC-14 하드웨어 사양"
    labels: ["type:design", "area:design", "stage:S2-mission", "prio:P2", "size:F", "needs-founder"]
    milestone: "S2"
    depends_on: [D0-02c, V-05]
    body: |-
      ## 대목표
      G5 — 시뮬에서 된 설계가 실물 키트로 이어지고 실측이 판정을 보정한다. (에픽 HW, docs/plan/studio-plan.md 15.4절)
      ## 핵심 가치
      > **V3 한 번에 100%** — 작은 단위를 증거와 함께 완전히 끝낸다. 부분 완성은 미완성이다.
      > **V1 정직한 판정** — 판정은 시뮬과 몬테카를로만 한다. 확률, 가정, 한계를 숨기지 않는다. 1회 미리보기 실행을 판정이라 부르지 않는다.
      이 이슈가 없으면: 승인본이 없어 해당 화면의 구현 이슈가 착수하지 못한다.
      ## 문제
      하드웨어 사양 화면의 승인본이 없다.
      ## 완료 정의 (DoD)
      - [ ] omp가 `design/briefs/sc-14.md`를 썼다(상태: BOM(가격 없음, 조달 필요, 선언·추정 줄), 충족도, 수계산 결과와 "FEA 필요" 라벨, 폐루프 전후 판정, 내보내기 제외 사유, "실물 검증 없음")
      - [ ] 창업자가 `/design`으로 만들고 승인했다
      - [ ] `design/exports/sc-14/`에 승인본이 커밋됐다
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      화면 구현. 3D 뷰포트 안의 상호작용.
      ## 검증 방법
      `ls design/exports/sc-14/`
      ## 의존성
      선행: D0-02c, V-05 / 후속: HW-06b
