    labels: ["type:epic", "area:core", "stage:S0-process", "prio:P0"]
    milestone: "S0 Process"
    depends_on: []
    body: |-
      ## 대목표
      G1 — 창업자가 세 행성 어디서든 상상한 물건을 만들어 정직한 판정이 붙은 Halo로 내보낸다. (docs/plan/studio-plan.md 5절)
      ## 핵심 가치
      > **V1 정직한 판정** — 판정은 시뮬과 몬테카를로만 한다. 확률, 가정, 한계를 숨기지 않는다. 1회 미리보기 실행을 판정이라 부르지 않는다.
      > **V2 상상에서 현실까지** — 모든 기능은 생각 → 상상 → 실제 물리 세계의 거리를 줄여야 한다.
      이 이슈가 없으면: 최종 버전(오픈월드, 멀티와 파괴, XR, 공유 링크, 실시간 플레이)에 닿을 수 있는 구조인지 모른 채 S1을 시작하게 된다.
      ## 문제
      웹 + MuJoCo 권고는 측정 없이 내린 판단이다. 기준은 S1이 아니라 최종 버전의 요구여야 한다.
      ## 완료 정의 (DoD)
      - [ ] 하위 이슈 전부 닫힘: A0-01, A0-02, A0-03, A0-04, A0-05, A0-06, A0-07
      - [ ] 통합 시연 증거: `docs/decisions/engine.md`에 측정표, S1 주 클라이언트 결정, 전환·병행 조건이 있고 창업자가 승인한 것
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      제품 코드. 스파이크 코드는 `spikes/`에 두고 제품에 넣지 않는다.
      ## 검증 방법
      하위 이슈의 검증을 모두 통과한 뒤 통합 시연을 녹화하거나 로그로 남겨 이 이슈에 링크한다.
