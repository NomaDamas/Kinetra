    body: |-
      ## 대목표
      G1 — 창업자가 세 행성 어디서든 상상한 물건을 만들어 정직한 판정이 붙은 Halo로 내보낸다. (에픽 W, docs/plan/studio-plan.md 3절, 4.6절)
      ## 핵심 가치
      > **V2 상상에서 현실까지** — 모든 기능은 생각 → 상상 → 실제 물리 세계의 거리를 줄여야 한다.
      > **V5 깨끗한 출처** — 수치, 부품, 에셋은 출처와 라이선스가 기록된 것만 쓴다. 사용자가 선언한 값과 가져온 에셋은 배지로 구분한다.
      이 이슈가 없으면: 세 행성이 화면에서 구분되지 않아 "허허벌판에서 시작"이 성립하지 않는다.
      ## 문제
      화성 장면이 없다.
