      ## 완료 정의 (DoD)
      - [ ] 장갑판은 재료와 두께를 갖는 판 부품이다. 임계 하중 [N] = 재료 강도 [Pa] × 단면적 [m²]이고 계산은 X-04a를 쓴다. 단면적은 판 두께 × 지지 변의 길이다
      - [ ] 임계 하중은 판에 걸린 하중 [N]과 비교한다. 충격량 [N·s]이나 운동에너지 [J]를 임계 하중과 직접 비교하지 않는다(충돌 때의 비교 하중은 CB-05b가 정한다)
