      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      안전선 밖의 모든 것: 폭약·추진제·점화제의 조성과 제조, 탄두·신관·기폭 장치, 실제 무기의 유도·추적·조준·사격 통제, 작동하는 무기나 탄약의 제작 지침, 대결 부품의 실물 내보내기. 실존 무기 체계의 제원 재현.
