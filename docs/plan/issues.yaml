      ## 문제
      두 진영의 설계와 승패 규칙을 Project에 적을 형식이 없다.
      ## 완료 정의 (DoD)
      - [ ] MissionDef(M-01)를 확장한 MatchDef에 두 진영의 설계, 시작 배치, 승리 조건(상대 기능 상실, 구역 점령, 제한 시간), 진영별 예산(질량, 발사 에너지 총량)이 있다
      - [ ] 예산을 넘는 설계로는 대결을 시작할 수 없다
      - [ ] 한 판의 결과는 A 승, B 승, 무승부 셋 중 하나다. 제한 시간까지 어느 쪽도 승리 조건을 채우지 못하면 `on_timeout`을 따른다: `draw`(기본) 또는 MatchDef에 적은 판정식. 두 진영이 같은 스텝에 승리 조건을 채우면 무승부다
      - [ ] 승률의 분모가 MatchDef에 정의돼 있다: 무승부를 포함한 유효한 모든 판. 시뮬 오류로 끝난 판은 무효로 따로 세고 분모에 넣지 않는다. 유효한 판이 0이면 결과는 "판정 불가"다
      - [ ] 테스트: 예시 대결 2개의 검증과 저장·열기 왕복. 시간초과 사례와 동시 충족 사례가 무승부로 기록된다
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      실시간 네트워크 대결(S4). 자동 추적·유도·자동 조준. 실제 센서 모델. AI 상대.
