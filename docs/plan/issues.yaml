    labels: ["type:feature", "area:hardware", "stage:S2-mission", "prio:P2"]
    milestone: "S2"
    depends_on: [D0-02c, V-05, HW-05]
    body: |-
      ## 대목표
      G5 — 시뮬에서 된 설계가 실물 키트로 이어지고 실측이 판정을 보정한다. (에픽 HW, docs/plan/studio-plan.md 15.4절)
      ## 핵심 가치
      > **V2 상상에서 현실까지** — 모든 기능은 생각 → 상상 → 실제 물리 세계의 거리를 줄여야 한다.
