  - id: HW
    kind: epic
    parent: null
    title: "[HW] 하드웨어 설계"
    labels: ["type:epic", "area:hardware", "stage:S2-mission", "prio:P2"]
    milestone: "S2"
    depends_on: []
    body: |-
      ## 대목표
      G5 — 시뮬에서 된 설계가 실물 키트로 이어지고 실측이 판정을 보정한다. (docs/plan/studio-plan.md 15.4절)
      ## 핵심 가치
      > **V2 상상에서 현실까지** — 모든 기능은 생각 → 상상 → 실제 물리 세계의 거리를 줄여야 한다.
      > **V5 깨끗한 출처** — 수치, 부품, 에셋은 출처와 라이선스가 기록된 것만 쓴다. 사용자가 선언한 값과 가져온 에셋은 배지로 구분한다.
      이 이슈가 없으면: 시뮬에서 된 설계가 부품표와 제작 형상으로 이어지지 않아 실물까지의 거리가 줄지 않는다.
      ## 문제
      설계 단계(BOM, CAD, 수계산, 질량 폐루프)는 legacy에만 있고 새 계획에서는 S5로 미뤄져 있다. 창업자는 하드웨어 설계까지를 요구했다.
      ## 완료 정의 (DoD)
      - [ ] 하위 이슈 전부 닫힘: HW-01, HW-02, HW-03, HW-04, HW-05, HW-06, HW-07, HW-08, HW-09
      - [ ] 통합 시연 증거: S1의 로버 프로젝트에서 코드 수정 없이 하드웨어 사양서(BOM, STEP·STL, 수계산 라벨, 질량 폐루프 전후 판정, 모델 한계)가 나온 것, 그리고 legacy 로켓 자동차의 폐루프 사례(설계 질량 +175.2 kg 반영 뒤 성공 사례를 잃음. 출처: `legacy-v0` 태그의 `apps/web/public/demo/roadster/design.json`)를 새 구조에서 다시 계산해 차이를 적은 기록
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      실물 제작과 실측(에픽 K, S5). FEM. 전자 회로 설계(S5). 대결 부품의 내보내기.
      ## 검증 방법
      하위 이슈의 검증을 모두 통과한 뒤 통합 시연을 녹화하거나 로그로 남겨 이 이슈에 링크한다.
      ## 의존성
      선행: 없음 / 후속: 없음
