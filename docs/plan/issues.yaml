    kind: sub
    parent: HW-04
    title: "[HW-04b] 폐루프 재판정"
    labels: ["type:feature", "area:hardware", "stage:S2-mission", "prio:P2", "size:M"]
    milestone: "S2"
    depends_on: [HW-04a, HW-03b, J-05]
    body: |-
      ## 대목표
      G5 — 시뮬에서 된 설계가 실물 키트로 이어지고 실측이 판정을 보정한다. (에픽 HW, docs/plan/studio-plan.md 15.4절)
      ## 핵심 가치
      > **V2 상상에서 현실까지** — 모든 기능은 생각 → 상상 → 실제 물리 세계의 거리를 줄여야 한다.
      > **V5 깨끗한 출처** — 수치, 부품, 에셋은 출처와 라이선스가 기록된 것만 쓴다. 사용자가 선언한 값과 가져온 에셋은 배지로 구분한다.
      이 이슈가 없으면: 시뮬에서 된 설계가 부품표와 제작 형상으로 이어지지 않아 실물까지의 거리가 줄지 않는다.
      ## 문제
      설계한 하드웨어의 질량을 넣고 다시 판정하는 절차가 없다.
      ## 완료 정의 (DoD)
      - [ ] HW-04a가 추정한 "부품으로 모델되지 않은 하드웨어"의 질량만 순증분으로 더해 다시 판정하고, 반영 전후의 판정(성공 사례 유지·상실, p_success와 CI)을 나란히 보여 준다. 이미 Project에 든 선언·추정 질량은 다시 더하지 않는다. 상실이 `NOT_FOUND_IN_BUDGET`이면 "약한 증거"로 표시한다
      - [ ] 테스트: 선언 질량 부품이 든 프로젝트에서 재판정 질량 = 원래 총질량 + 순증분이고, 선언 질량이 두 번 더해지지 않는다
      - [ ] 회귀 사례: J-05의 로켓 자동차에 legacy 설계 질량(+175.2 kg, 그중 55.5 kg은 추정)을 부품으로 모델되지 않은 하드웨어의 순증분으로 반영한 결과를 기록하고, legacy 결과(1,300 kg에서 15.2% [12.3, 18.6], n = 500 → 1,475 kg에서 `NOT_FOUND_IN_BUDGET`)와의 차이를 수치로 적는다
      - [ ] legacy 수치의 출처를 기록에 적는다: `legacy-v0` 태그의 `apps/web/public/demo/roadster/design.json`(`totals.mass_added_kg`, `totals.mass_estimated_kg`, `closed_loop`)과 `apps/web/public/demo/roadster/scenario.json`(8 kN 변형의 `verdict.feasibility`). 이 값은 legacy 산출물에서 읽은 것이고, 새 구조의 회귀 기준은 J-05가 다시 계산해 고정한 값이다
      - [ ] 재판정은 처음 판정과 같은 탐색·몬테카를로 예산과 시드를 쓰고 그 사실이 표시된다
      - [ ] 테스트: 시드 고정 재현
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      질량을 줄이는 자동 최적화. 실측 질량의 반영(S5).
      ## 검증 방법
      `uv run pytest packages/judge -q -k closed_loop`
