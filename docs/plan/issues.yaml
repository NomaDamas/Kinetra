      이 이슈가 없으면: 물이 있는 장면(배, 부유체, 수중 이동)을 만들 수 없거나, 근사를 숨긴 채 판정처럼 보여 주게 된다.
      ## 문제
      물에 놓은 물체가 뜨지 않는다.
      ## 완료 정의 (DoD)
      - [ ] 수역은 FL-02b의 수평 영역을 바닥(수면 높이 − 깊이)과 수면 사이로 세운 기둥이다. 충돌 프록시(상자, 구, 원통·캡슐, 볼록체)와 이 기둥의 교집합으로 잠긴 부피를 구하고, 그 교집합의 도심을 부심으로 삼아 바디별 힘으로 준다. 수역의 측면 밖, 바닥 아래, 수면 위는 물이 아니다. 물리 수면은 평면이다
      - [ ] 가정표에 "근사: 부력(프록시의 잠긴 부피)"로 표시된다
      - [ ] 테스트: 상자·구·원통의 평형 흘수를 수계산과 대조(오차 1% 이하), 세 행성의 중력에서 평형 흘수가 같다는 단언
      - [ ] 테스트(경계): 수역 측면에 반쯤 걸친 상자의 부력과 부심이 교집합의 부피·도심 수계산과 맞는다(오차 1% 이하). 바닥 아래로 내려간 부분은 잠긴 부피에서 빠지고, 전부 바닥 아래면 힘이 0이다. 수평으로 완전히 밖에 있거나 수면 위에 있는 바디에는 힘이 0이다
      - [ ] 반복 실행의 궤적 해시가 같다
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      파도 하중, 조파 저항, 양력(수중익), 슬로싱, 공동, 표면장력.
      ## 검증 방법
      `uv run pytest packages/engine -q -k buoyancy`
      ## 의존성
      선행: FL-01, FL-02b, X-01a / 후속: FL-03b, FL-03d
