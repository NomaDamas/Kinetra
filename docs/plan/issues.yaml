items:
  - id: P0
    kind: epic
    parent: null
    title: "[P0] 개발 루프"
    labels: ["type:epic", "area:process", "stage:S0-process", "prio:P0"]
    milestone: "S0 Process"
    depends_on: []
    body: |-
      ## 대목표
      G0 — 모든 작업이 대목표·핵심 가치·계획에 묶여 한 번에 100% 끝나는 루프를 만든다. (docs/plan/studio-plan.md 12절)
      ## 핵심 가치
      > **V3 한 번에 100%** — 작은 단위를 증거와 함께 완전히 끝낸다. 부분 완성은 미완성이다.
      이 이슈가 없으면: 이슈·PR·리뷰·머지가 계획과 핵심 가치에 묶이지 않아 작업이 표류한다.
      ## 문제
      새 출발 저장소에는 템플릿, CI, 리뷰 봇, 원장, 이슈 등록 수단이 없다.
      ## 완료 정의 (DoD)
      - [ ] 하위 이슈 전부 닫힘: P0-01, P0-02, P0-03, P0-04, P0-05, P0-06, P0-07, P0-08
      - [ ] 통합 시연 증거: 시험 PR 1건이 이슈 → 브랜치 → CI → Sol 리뷰 → omp 트리아지 → squash 머지를 끝까지 통과한 기록(링크)
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      제품 기능 구현. Studio 코드는 S1에서 다룬다.
      ## 검증 방법
      하위 이슈의 검증을 모두 통과한 뒤 통합 시연을 녹화하거나 로그로 남겨 이 이슈에 링크한다.
      ## 의존성
      선행: 없음 / 후속: 없음
