      ## 핵심 가치
      > **V1 정직한 판정** — 판정은 시뮬과 몬테카를로만 한다. 확률, 가정, 한계를 숨기지 않는다. 1회 미리보기 실행을 판정이라 부르지 않는다.
      > **V5 깨끗한 출처** — 수치, 부품, 에셋은 출처와 라이선스가 기록된 것만 쓴다. 사용자가 선언한 값과 가져온 에셋은 배지로 구분한다.
      이 이슈가 없으면: 지구·화성·달 어디서도 그 행성의 물리로 돌려 볼 수 없다.
      ## 문제
      행성 상수, 평지 장면, 행성별 물리 적용, 전환이 없다.
      ## 완료 정의 (DoD)
      - [ ] 하위 이슈 전부 닫힘: W-01, W-02, W-03, W-04, W-05
      - [ ] 통합 시연 증거: 같은 4륜차가 세 행성 평지에서 나란히 달리는 영상과 행성별 수계산 대조표
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      DEM 지형, 구형 행성, 궤도, 날개와 양력.
      ## 검증 방법
      하위 이슈의 검증을 모두 통과한 뒤 통합 시연을 녹화하거나 로그로 남겨 이 이슈에 링크한다.
      ## 의존성
      선행: 없음 / 후속: 없음
