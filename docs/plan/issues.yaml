    body: |-
      ## 대목표
      G4 — 설계로 겨루고 함께 짓고 부순다. (에픽 CB, docs/plan/studio-plan.md 15.3절)
      ## 핵심 가치
      > **V1 정직한 판정** — 판정은 시뮬과 몬테카를로만 한다. 확률, 가정, 한계를 숨기지 않는다. 1회 미리보기 실행을 판정이라 부르지 않는다.
      > **V4 보여줄 수 있는 결과** — 결과는 시뮬 리플레이 그대로 영상과 플레이 링크가 된다. 연출은 카메라·조명·편집만 바꾸고 궤적은 바꾸지 않는다.
      이 이슈가 없으면: 두 진영의 설계가 같은 물리 아래에서 겨루는 대결을 만들 수 없다.
      ## 문제
      충돌의 결과를 "누가 무엇을 잃었는가"로 읽을 규칙이 없다.
      ## 완료 정의 (DoD)
      - [ ] 비교량을 힘으로 통일한다: 결합부 하중 [N](구속력)이 임계 하중 [N](X-04a: 강도 [Pa] × 단면적 [m²])을 넘으면 X-04b의 결합 해제가 일어난다. 충격량 [N·s]을 임계 하중과 직접 비교하지 않는다
      - [ ] 충돌 때의 결합부 하중은 고정된 물리 시간 창으로 평균한 구속력(창 안의 구속 충격량 ÷ 창 길이)으로 잡는다. 창 길이는 `기본값` 배지가 붙은 게임 규칙 값으로 가정표에 나오고, 허용하는 가장 큰 시간 간격보다 길다
      - [ ] 구동 부품이 떨어져 나가면 그 기능이 멈춘다. 진영별 "기능 상실" 식(이동 불가, 발사 불가, 뒤집힘)이 성공 조건(J-02a)의 형식으로 있다
      - [ ] 테스트: 고정 시드 장면에서 예상한 결합만 풀린다
      - [ ] 테스트(시간 간격): 시간 간격을 기준의 1/2과 1/4로 바꾼 실행에서도 풀리는 결합의 집합이 같고 창 평균 하중의 차이가 10% 이하다 [제안]. 이를 넘는 속도·질량 조합은 허용 범위(CB-05a)에서 뺀다
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      폭발과 파편, 화재, 유연체 변형, FEM.
      ## 검증 방법
      `uv run pytest packages/engine -q -k damage`
      ## 의존성
      선행: CB-05a, CB-04d, J-02a / 후속: CB-05c, CB-06, CB-06a, CB-12
