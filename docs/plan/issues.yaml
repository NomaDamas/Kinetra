      > **V1 정직한 판정** — 판정은 시뮬과 몬테카를로만 한다. 확률, 가정, 한계를 숨기지 않는다. 1회 미리보기 실행을 판정이라 부르지 않는다.
      > **V4 보여줄 수 있는 결과** — 결과는 시뮬 리플레이 그대로 영상과 플레이 링크가 된다. 연출은 카메라·조명·편집만 바꾸고 궤적은 바꾸지 않는다.
      이 이슈가 없으면: 두 진영의 설계가 같은 물리 아래에서 겨루는 대결을 만들 수 없다.
      ## 문제
      대결 한 판의 결과는 1회 실행일 뿐인데 그것이 "이 설계가 더 강하다"로 읽힌다.
      ## 완료 정의 (DoD)
      - [ ] 두 진영이 모두 스케줄일 때 가정표(질량, 마찰, 발사 에너지 편차 등)를 흔든 몬테카를로로 A 승률, B 승률, 무승부율과 각각의 95% CI, 판정을 뒤집는 가정 1위를 낸다. 분모는 MatchDef의 정의(무승부를 포함한 유효한 모든 판)를 쓰고 무효 판 수를 카드에 함께 적는다
      - [ ] "우세"는 두 승률의 차이의 95% CI가 0을 포함하지 않을 때만 표시한다. 포함하면 "우세 없음"이다
      - [ ] 수동 조종이 낀 대결 한 판은 "1회 실행. 판정이 아닙니다"로 표시된다
      - [ ] 테스트: 시드 고정 재현. 진영 라벨을 맞바꿔 같은 시드로 돌리면 두 진영의 승수가 정확히 맞바뀌고 무승부 수는 같다
      - [ ] 테스트(대칭): 두 진영이 같은 설계이고 배치가 거울 대칭인 대결에서 두 승률의 차이의 95% CI가 0을 포함한다. 각 승률이 50%일 것을 요구하지 않는다
      - [ ] 테스트(전부 무승부): 두 진영 모두 발사기가 없고 제한 시간이 짧은 대결에서 두 승률이 0, 무승부율이 1이고 표시는 "우세 없음"이다
      - [ ] 테스트(전부 무효): 모든 판이 시뮬 오류로 끝나면 "판정 불가"로 표시되고 승률, CI, "우세"가 산출되지 않으며 무효 판 수가 카드에 나온다
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      실시간 네트워크 대결(S4). 자동 추적·유도·자동 조준. 실제 센서 모델. AI 상대.
      ## 검증 방법
      `uv run pytest packages/judge -q -k match_verdict`
      ## 의존성
      선행: CB-06c, J-01a, J-03 / 후속: CB-07, CB-07c, CB-08, CB-08b, CB-10, CB-11
