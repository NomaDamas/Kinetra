      ## 핵심 가치
      > **V3 한 번에 100%** — 작은 단위를 증거와 함께 완전히 끝낸다. 부분 완성은 미완성이다.
      이 이슈가 없으면: 이슈·PR·리뷰·머지가 계획과 핵심 가치에 묶이지 않아 작업이 표류한다.
      ## 문제
      현재 main은 이전 제품(설계 브리프 도구)의 코드와 문서로 차 있어 새 계획의 기준점이 없다.
      ## 완료 정의 (DoD)
      - [ ] 하위 이슈 전부 닫힘: P0-01a, P0-01b, P0-01c
      - [ ] 통합 시연 증거: `legacy-v0` 태그에서 기존 테스트가 돌고, main에는 새 트리와 계획 문서만 있는 상태를 한 번에 보여 준다.
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      기존 코드의 이식. 이식은 S1의 각 이슈가 맡는다.
      ## 검증 방법
      `git checkout legacy-v0 && uv run pytest packages/engine/tests -q`, 이어서 main에서 `ls`와 `cat docs/plan/values.md`
      ## 의존성
      선행: 없음 / 후속: 없음
