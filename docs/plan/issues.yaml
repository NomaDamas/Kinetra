  - id: FL-01
    kind: issue
    parent: FL
    title: "[FL-01] MuJoCo 매질 모델과 수역 한정 힘 스파이크"
    labels: ["type:research", "area:fluid", "stage:S0-process", "prio:P1", "size:M"]
    milestone: "S0 Process"
    depends_on: [P0-01b]
    body: |-
      ## 대목표
      G6 — 물·바다·유체가 있는 장면도 근사의 등급을 밝힌 채 만들고 돌려 본다. (에픽 FL, docs/plan/studio-plan.md 15.2절)
      ## 핵심 가치
      > **V1 정직한 판정** — 판정은 시뮬과 몬테카를로만 한다. 확률, 가정, 한계를 숨기지 않는다. 1회 미리보기 실행을 판정이라 부르지 않는다.
      > **V5 깨끗한 출처** — 수치, 부품, 에셋은 출처와 라이선스가 기록된 것만 쓴다. 사용자가 선언한 값과 가져온 에셋은 배지로 구분한다.
      이 이슈가 없으면: 물이 있는 장면(배, 부유체, 수중 이동)을 만들 수 없거나, 근사를 숨긴 채 판정처럼 보여 주게 된다.
      ## 문제
      MuJoCo의 매질 밀도·점성이 모델 전역 값인지, 수역 안에서만 부력과 항력을 주려면 무엇이 필요한지 확인하지 않았다 [확인 필요]. 물은 최종 버전의 요구가 됐는데 엔진 측정표(5.2절)에 없다.
      ## 완료 정의 (DoD)
      - [ ] MuJoCo 문서와 실행으로 확인해 기록했다: 매질 `density`·`viscosity`가 전역인지, 타원체 유체 모델이 부가질량과 항력을 어디까지 다루는지, 부력이 내장돼 있는지. 확인한 버전을 적는다
      - [ ] 상자 한 개에 수면 아래 잠긴 부피만큼의 힘을 바디별 외력(또는 passive 콜백)으로 주어 평형 흘수를 아르키메데스 수계산과 대조했다(오차 수치)
      - [ ] 부가질량을 넣는 방법 후보(관성 증가, 가속도 비례 힘)의 수치 안정성, 스텝당 비용, 반복 실행 해시 일치 여부를 기록했다
      - [ ] `docs/research/fluids/mujoco-water.md`에 결론과 W-03b(집중 항력)가 참고할 권고(매질 밀도를 위치로 조회하는 함수로 둘지)가 있고, engine.md 측정표에 넣을 행이 정리됐다
      - [ ] 증거: 머신 사양, 명령, 시드가 붙은 표
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      제품 코드. 입자 유체. 파도.
      ## 검증 방법
      `uv run python spikes/fluids/mujoco_water.py --seed 0`
      ## 의존성
      선행: P0-01b / 후속: FL-03, FL-03a
