      - [ ] 테스트: 두께를 두 배로 하면 임계 하중이 수계산대로 두 배가 된다. 임계의 0.9배인 정적 하중에서는 파단 이벤트가 없고 1.1배에서는 있다. 시간 간격을 반으로 줄여도 두 결과가 같다
