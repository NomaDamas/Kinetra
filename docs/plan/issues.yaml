    title: "[CB-02] 고속 투사체·충돌 스파이크"
    labels: ["type:research", "area:combat", "stage:S0-process", "prio:P1", "size:M"]
    milestone: "S0 Process"
    depends_on: [P0-01b]
    body: |-
      ## 대목표
      G4 — 설계로 겨루고 함께 짓고 부순다. (에픽 CB, docs/plan/studio-plan.md 15.3절)
      ## 핵심 가치
      > **V1 정직한 판정** — 판정은 시뮬과 몬테카를로만 한다. 확률, 가정, 한계를 숨기지 않는다. 1회 미리보기 실행을 판정이라 부르지 않는다.
      > **V4 보여줄 수 있는 결과** — 결과는 시뮬 리플레이 그대로 영상과 플레이 링크가 된다. 연출은 카메라·조명·편집만 바꾸고 궤적은 바꾸지 않는다.
      이 이슈가 없으면: 두 진영의 설계가 같은 물리 아래에서 겨루는 대결을 만들 수 없다.
      ## 문제
      MuJoCo가 빠르고 작은 물체의 충돌을 놓치는지(터널링), 충격으로 결합이 풀리는 동작이 재현되는지 모른다. 대결은 최종 버전의 요구가 됐는데 엔진 측정표(5.2절)에 없다.
      ## 완료 정의 (DoD)
      - [ ] 질량 0.1·1·10 kg의 구를 50·200·800 m/s로 두께 10·50 mm 판에 충돌시켜, 시간 간격별로 판을 그냥 통과하는지, 접촉 충격량 [N·s], 최대 접촉력 [N]을 표로 기록했다(수치는 측정용 격자이며 실제 무기 제원이 아니다)
      - [ ] 결합부 하중 [N]이 임계 하중 [N]을 넘을 때 결합이 풀리는 장면의 반복 실행 해시 일치 여부를 기록했다. 시간 간격을 바꿨을 때 최대 접촉력과 고정 시간 창으로 평균한 접촉력이 각각 얼마나 달라지는지도 기록했다
      - [ ] 터널링 없이 다룰 수 있는 속도·시간 간격의 범위와 대책 후보(서브스텝, 스윕 검사)를 `docs/research/combat/projectile-limits.md`에 적고 engine.md 측정표에 넣을 행을 정리했다. Jolt 쪽 수치는 A0-03에 있으면 인용하고 없으면 [확인 필요]로 둔다
      - [ ] 증거: 머신 사양, 명령, 시드가 붙은 표
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      제품 코드. 종말탄도(관통 깊이, 파편) 모델. 실존 무기 제원의 재현.
      ## 검증 방법
      `uv run python spikes/combat/projectile_limits.py --seed 0`
      ## 의존성
      선행: P0-01b / 후속: CB-04, CB-04b
