      ## 문제
      안전선의 근거로 든 법, 수출통제, 플랫폼 정책의 구체 조항을 확인하지 않았다 [확인 필요]. 확인 없이 대결 부품을 만들면 선이 너무 느슨한지 너무 좁은지 알 수 없다.
      ## 완료 정의 (DoD)
      - [ ] 한국(총포·화약류 관련 법, 전략물자 수출통제), 미국(ITAR, EAR), LLM 제공사 이용 정책, 영상·호스팅 플랫폼 정책에서 대결 모드와 닿는 조항을 출처 링크·열람일과 함께 `docs/research/combat/legal-checklist.md`에 정리했다. 찾지 못한 항목은 [확인 필요]로 남긴다
      - [ ] 법률 자문이 필요한 항목의 목록과 창업자 결정 코멘트(자문을 받는다 / 범위를 더 좁힌다 / 그대로 간다)
      - [ ] 안전선 문안을 바꿔야 한다는 결론이면 `type:plan-change` 이슈를 열었다
      - [ ] "100% 완료" 8항목 충족(`docs/process/done-definition.md`, issues.yaml `done_definition`)
      ## 범위 밖
      법률 자문 자체. 가드 구현(CB-07).
      ## 검증 방법
      문서와 결정 코멘트
      ## 의존성
      선행: CB-01a, V-05 / 후속: CB-04, CB-04a
