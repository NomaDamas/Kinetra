[project]
name = "kinetra-engine"
version = "0.1.0"
description = "Kinetra pipeline: templates, search, Monte-Carlo verdict, API"
requires-python = ">=3.10"
dependencies = [
  "physlab-core",
  "mujoco>=3.2",
  "cma>=4.0",
  "numpy",
  "scipy",
  "fastapi",
  "uvicorn",
  "websockets",
  "trimesh",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetra_engine"]
