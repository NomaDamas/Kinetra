[project]
name = "kinetra-engine"
version = "0.0.0"
description = "Physics engine adapters (compile Project to engine, run)"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper==1.2.1",
    # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which av 19 removed; it declares only av>=11
    "av>=11,<19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetra_engine"]
