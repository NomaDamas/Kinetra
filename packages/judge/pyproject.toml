[project]
name = "kinetra-judge"
version = "0.0.0"
description = "Judgment: necessary-condition screen, search, Monte-Carlo verdicts"
requires-python = ">=3.11"
dependencies = ["kinetra-core", "pydantic>=2.14,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetra_judge"]
