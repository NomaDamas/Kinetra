[project]
name = "kinetra-core"
version = "0.0.0"
description = "Engine-independent Project model and command layer"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetra_core"]

[tool.hatch.build.targets.wheel.force-include]
"../../data/bodies" = "kinetra_core/bodies_data"
