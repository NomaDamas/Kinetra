[project]
name = "physlab-core"
version = "0.1.0"
description = "Shared contracts (SpecSheet / Trajectory / Verdict) for the physical feasibility harness"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core/src/physlab_core"]
