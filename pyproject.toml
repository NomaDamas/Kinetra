[project]
name = "kinetra"
version = "0.0.0"
description = "Kinetra Studio workspace root (see docs/plan/studio-plan.md)"
requires-python = ">=3.11"
dependencies = ["kinetra-core", "kinetra-engine", "kinetra-judge"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/engine", "packages/judge"]

[tool.uv.sources]
kinetra-core = { workspace = true }
kinetra-engine = { workspace = true }
kinetra-judge = { workspace = true }
