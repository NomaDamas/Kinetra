version = 1
revision = 1
requires-python = ">=3.11"

[manifest]
members = [
    "kinetra",
    "kinetra-core",
    "kinetra-engine",
    "kinetra-judge",
]

[[package]]
name = "kinetra"
version = "0.0.0"
source = { virtual = "." }
dependencies = [
    { name = "kinetra-core" },
    { name = "kinetra-engine" },
    { name = "kinetra-judge" },
]

[package.metadata]
requires-dist = [
    { name = "kinetra-core", editable = "packages/core" },
    { name = "kinetra-engine", editable = "packages/engine" },
    { name = "kinetra-judge", editable = "packages/judge" },
]

[[package]]
name = "kinetra-core"
version = "0.0.0"
source = { editable = "packages/core" }

[[package]]
name = "kinetra-engine"
version = "0.0.0"
source = { editable = "packages/engine" }

[[package]]
name = "kinetra-judge"
version = "0.0.0"
source = { editable = "packages/judge" }
