<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S4 에이전트 생각 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
input::placeholder{color:#93A0AE;opacity:1}
:focus-visible{outline:2px solid #A8CBFF;outline-offset:2px}
.kin-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{transition-property:opacity!important;animation:none!important}}
</style>
</helmet>
<div style="width:1200px;height:96px;box-sizing:border-box;background:#0F1216;color:#E8EDF2;font-family:Pretendard,'Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:13px;line-height:20px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column">

<div data-note="1" style="flex:none;height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;border-bottom:1px dashed #7A899B;font-size:12px;line-height:16px;color:#A9B4C0"><span><strong style="color:#E8EDF2;font-weight:600">S4 에이전트 생각 중</strong> · 변경안 없음. 입력창은 막지 않아 다음 요청을 써 둘 수 있습니다 [제안]</span><span>상시 조작 요소 3: 마이크, 입력창, 취소 · primary 0</span></div>

<div data-screen="S4" style="position:relative;flex:none;height:56px;display:flex;flex-direction:column">
<div role="group" aria-label="에이전트 바" style="flex:none;height:56px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 12px;background:#151A20;border-top:1px solid #26303A">
<div style="order:1;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;height:32px;box-sizing:border-box;padding:0 8px;border:1px solid #7A899B;border-radius:4px;background:#0F1318">
<input data-ctl="입력창" aria-label="에이전트에게 요청하기" aria-describedby="s4-hint" placeholder="에이전트에게 요청하기" style="flex:1 1 0;min-width:0;height:24px;padding:0;border:0;background:transparent;color:#E8EDF2;font-size:13px">
<span id="s4-hint" style="flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:16px;color:#93A0AE"><kbd style="font-family:'JetBrains Mono',monospace;font-size:11px;line-height:16px;color:#A9B4C0;border:1px solid #3A4654;border-radius:2px;padding:0 4px">Enter</kbd>보내기</span>
</div>
<button type="button" data-ctl="마이크" aria-label="음성 입력 시작" title="음성 입력 시작" style="order:0;flex:none;width:32px;height:32px;padding:0;border:1px solid #7A899B;border-radius:999px;background:transparent;color:#E8EDF2;display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="1.5" width="4" height="7" rx="2"/><path d="M2.5 7a4.5 4.5 0 0 0 9 0M7 11.5v1.5"/></svg></button>
<div style="order:2;flex:none;display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:#E8EDF2">
<div role="status" aria-live="polite" aria-busy="true" style="display:flex;align-items:center;gap:6px"><span class="kin-sr">에이전트 상태:</span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#E8EDF2" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 1.5a4.5 4.5 0 1 1-4.5 4.5"/></svg>생각 중</div>
<button type="button" data-ctl="취소" aria-label="생각 중인 요청 취소" title="생각 중인 요청 취소. 설계는 바뀌지 않습니다" style="flex:none;height:28px;padding:0 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:#E8EDF2;font-size:12px;font-weight:500;text-decoration:underline">취소</button>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":96}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
