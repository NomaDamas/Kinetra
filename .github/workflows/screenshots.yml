name: screenshots

# P0-04d: Playwright (headless Chromium) screenshots of the pages listed in .github/screenshots.json, uploaded as the
# `screenshots` artifact on every PR (the part glTF page of B-01c adds out/gltf-check), plus a raw-WebGL empty scene whose PIXELS are asserted (proves WebGL renders headless).
# A listed path that does not exist is skipped with a log line. Rules: docs/process/screenshots.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright browser
        run: pnpm --filter @kinetra/screenshots exec playwright-core install --with-deps chromium-headless-shell
      - name: Screenshots of the listed pages
        run: pnpm --filter @kinetra/screenshots capture
      - name: WebGL empty scene (pixel assertion, headless)
        run: pnpm --filter @kinetra/screenshots webgl
      - name: WebGL flag sets (evidence, never fails the job)
        continue-on-error: true
        # absolute --out: `pnpm --filter` runs in tools/screenshots, a relative path would land there, outside the uploaded out/
        run: pnpm --filter @kinetra/screenshots webgl --probe --out "$GITHUB_WORKSPACE/out/webgl-probe"
      - name: Browser tests of the tool
        run: pnpm --filter @kinetra/screenshots test:browser
      - name: "Part glTF in three.js (B-01c: loader, linear material slot, screenshot in out/gltf-check)"
        run: pnpm --filter @kinetra/gltf-check capture
      - name: Browser tests of the part glTF page
        run: pnpm --filter @kinetra/gltf-check test:browser
      - name: Artifact content check (screenshots, webgl and webgl-probe must all be there)
        if: always()
        run: |
          for f in out/screenshots/manifest.json out/webgl/webgl-result.json out/webgl-probe/webgl-result.json out/gltf-check/parts-gltf.png out/gltf-check/result.json; do
            test -s "$f" && echo "present: $f" || { echo "MISSING: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: out/ # screenshots/ (pages + manifest), webgl/ (pixel-assertion run), webgl-probe/ (flag-set evidence), gltf-check/ (B-01c part glTF page: PNG + result.json)
          if-no-files-found: error
          retention-days: 14
