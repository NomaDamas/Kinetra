name: web

# P0-04b: pnpm workspace (apps/*, packages/ui) install, lint, build, test on every PR and on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Guard tests (scripts/ci)
        run: node --test "scripts/ci/tests/*.test.mjs"
      - name: Guard - packages with source must define lint, build, test
        run: node scripts/ci/check_web_scripts.mjs
      - name: Workspace projects and their scripts
        run: pnpm -r list --depth -1 && pnpm -r exec node -e "const p=require('./package.json');console.log(p.name,Object.keys(p.scripts||{}).join(',')||'(no scripts)')"
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @kinetra/design-tools exec playwright-core --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache (keyed by the exact playwright-core version)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium-headless-shell
      - name: Playwright OS dependencies (apt only if something is missing; retries + timeout)
        timeout-minutes: 8
        run: node scripts/ci/playwright_deps.mjs @kinetra/design-tools chromium-headless-shell
      - name: Playwright browser for tools/design (D0-04 design compare tests)
        timeout-minutes: 5
        run: pnpm --filter @kinetra/design-tools exec playwright-core install chromium-headless-shell
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
