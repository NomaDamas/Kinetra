name: assets

# P0-05b: every file under assets/ and apps/**/public has a row in assets/LEDGER.csv, every asset row's file
# exists with the recorded sha256 (unmodified assets), CREDITS.md matches the ledger. Python stdlib only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Guard tests (scripts/tests, tools/assets/tests)
        run: |
          uv run python -m unittest discover -s scripts/tests -v
          uv run python -m unittest discover -s tools/assets/tests -v
      - name: Ledger check
        run: uv run python scripts/check_assets.py
