name: 디자인
description: 화면 디자인. Claude Design 브리프에서 시작해 창업자가 승인한 내보내기로 끝난다.
title: '[DESIGN] '
labels:
- type:design
- needs-founder
body:
- type: markdown
  attributes:
    value: |-
      모든 항목은 필수다. 이슈 본문은 대목표 → 핵심 가치 → '이것이 없으면 대목표의 무엇이 막히는가' → 세부 순서다(docs/process/done-definition.md).

      디자인 승인본은 창업자 승인 대상이다.
- type: dropdown
  id: goal
  attributes:
    label: 대목표
    description: docs/plan/values.md의 대목표 G0~G5 중 이 일이 속한 것 하나.
    options:
    - G0 모든 작업이 대목표·핵심 가치·계획에 묶여 한 번에 100% 끝나는 루프를 만든다.
    - G1 창업자가 세 행성 어디서든 상상한 물건을 만들어 정직한 판정이 붙은 Halo로 내보낸다.
    - G2 같은 프로젝트에 목표와 규칙을 얹어 미션과 게임, 열린 세계로 넓힌다.
    - G3 만화 장면이 실제로 되는지 필요조건과 에너지로 답한다.
    - G4 설계로 겨루고 함께 짓고 부순다.
    - G5 시뮬에서 된 설계가 실물 키트로 이어지고 실측이 판정을 보정한다.
  validations:
    required: true
- type: input
  id: goal-link
  attributes:
    label: 대목표 연결
    description: 상위 에픽 이슈와 계획 문서 절.
    placeholder: '#에픽, docs/plan/studio-plan.md N절'
  validations:
    required: true
- type: dropdown
  id: values
  attributes:
    label: 핵심 가치
    description: 이 일이 지키는 핵심 가치(V1~V5). 하나 이상.
    multiple: true
    options:
    - V1 정직한 판정
    - V2 상상에서 현실까지
    - V3 한 번에 100%
    - V4 보여줄 수 있는 결과
    - V5 깨끗한 출처
  validations:
    required: true
- type: textarea
  id: values-quote
  attributes:
    label: 핵심 가치 원문
    description: values.md 원문을 글자 그대로 1~2개 인용한다.
    placeholder: '> **V3 한 번에 100%** — 작은 단위를 증거와 함께 완전히 끝낸다. 부분 완성은 미완성이다.'
  validations:
    required: true
- type: input
  id: without-this
  attributes:
    label: 이것이 없으면 대목표의 무엇이 막히는가
    description: 한 줄. 이 이슈가 없을 때 대목표에서 안 되는 것.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 문제
    description: 어떤 화면이 왜 필요한가.
  validations:
    required: true
- type: textarea
  id: dod
  attributes:
    label: 완료 정의 (DoD)
    description: 승인된 내보내기가 design/exports에 있고 구현 이슈가 그 경로를 인용한다.
    value: |-
      - [ ] 브리프: design/briefs/…
      - [ ] 승인된 내보내기: design/exports/…
      - [ ] 증거 단계·배지가 화면에 빠지지 않았다
      - [ ] 창업자 승인 기록
      - [ ] "100% 완료" 8항목 충족(docs/process/done-definition.md)
  validations:
    required: true
- type: textarea
  id: out-of-scope
  attributes:
    label: 범위 밖
    description: 하지 않을 것. 없으면 '없음'. DoD 밖에서 발견한 일은 고치지 않고 새 이슈로 등록한다.
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: 검증 방법
    description: 명령어와 기대 결과.
    placeholder: 승인본 경로와 스크린샷
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 의존성
    description: '선행 #… / 후속 #… (없으면 ''없음'').'
  validations:
    required: true
- type: input
  id: brief-path
  attributes:
    label: 디자인 브리프 경로
    description: 저장소 안 경로.
    placeholder: design/briefs/…
  validations:
    required: true
- type: input
  id: export-path
  attributes:
    label: 승인된 내보내기 경로
    description: 창업자가 승인한 Claude Design 내보내기. 아직 승인 전이면 '승인 대기'.
    placeholder: design/exports/…
  validations:
    required: true
