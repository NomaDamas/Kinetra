name: 작업
description: 하루(M) 이하 잎 이슈 하나 = PR 하나. 기능, 작업, 버그.
title: '[ID] '
labels:
- type:task
body:
- type: markdown
  attributes:
    value: |-
      모든 항목은 필수다. 이슈 본문은 대목표 → 핵심 가치 → '이것이 없으면 대목표의 무엇이 막히는가' → 세부 순서다(docs/process/done-definition.md).

      하루(M)를 넘는 일은 등록하지 말고 쪼갠다.
- type: dropdown
  id: goal
  attributes:
    label: 대목표
    description: docs/plan/values.md의 대목표 G0~G5 중 이 일이 속한 것 하나.
    options:
    - G0 모든 작업이 대목표·핵심 가치·계획에 묶여 한 번에 100% 끝나는 루프를 만든다.
    - G1 창업자가 세 행성 어디서든 상상한 물건을 만들어 정직한 판정이 붙은 Halo로 내보낸다.
    - G2 같은 프로젝트에 목표와 규칙을 얹어 미션과 게임, 열린 세계로 넓힌다.
    - G3 만화 장면이 실제로 되는지 필요조건과 에너지로 답한다.
    - G4 설계로 겨루고 함께 짓고 부순다.
    - G5 시뮬에서 된 설계가 실물 키트로 이어지고 실측이 판정을 보정한다.
  validations:
    required: true
- type: input
  id: goal-link
  attributes:
    label: 대목표 연결
    description: 상위 에픽 이슈와 계획 문서 절.
    placeholder: '#에픽, docs/plan/studio-plan.md N절'
  validations:
    required: true
- type: dropdown
  id: values
  attributes:
    label: 핵심 가치
    description: 이 일이 지키는 핵심 가치(V1~V5). 하나 이상.
    multiple: true
    options:
    - V1 정직한 판정
    - V2 상상에서 현실까지
    - V3 한 번에 100%
    - V4 보여줄 수 있는 결과
    - V5 깨끗한 출처
  validations:
    required: true
- type: textarea
  id: values-quote
  attributes:
    label: 핵심 가치 원문
    description: values.md 원문을 글자 그대로 1~2개 인용한다.
    placeholder: '> **V3 한 번에 100%** — 작은 단위를 증거와 함께 완전히 끝낸다. 부분 완성은 미완성이다.'
  validations:
    required: true
- type: input
  id: without-this
  attributes:
    label: 이것이 없으면 대목표의 무엇이 막히는가
    description: 한 줄. 이 이슈가 없을 때 대목표에서 안 되는 것.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 문제
    description: 지금 무엇이 안 되는가.
  validations:
    required: true
- type: textarea
  id: dod
  attributes:
    label: 완료 정의 (DoD)
    description: 관찰 가능한 결과를 체크박스로. 테스트와 증거 항목을 지우지 않는다.
    value: "- [ ] \n- [ ] 테스트: \n- [ ] 증거: \n- [ ] 문서·원장 갱신\n- [ ] \"100% 완료\" 8항목 충족(docs/process/done-definition.md)"
  validations:
    required: true
- type: textarea
  id: out-of-scope
  attributes:
    label: 범위 밖
    description: 하지 않을 것. 없으면 '없음'. DoD 밖에서 발견한 일은 고치지 않고 새 이슈로 등록한다.
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: 검증 방법
    description: 명령어와 기대 결과.
    placeholder: '예: uv run pytest packages/engine/tests -q → 모두 통과'
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 의존성
    description: '선행 #… / 후속 #… (없으면 ''없음'').'
  validations:
    required: true
